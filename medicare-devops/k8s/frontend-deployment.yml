apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:                       # <--- spec goes here
      containers:
        - name: frontend
          image: frontend-app:latest
          imagePullPolicy: Never   # <-- local Docker image
          ports:
            - containerPort: 80