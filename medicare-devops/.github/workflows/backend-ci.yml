name: Backend CI/CD

on:
  push:
    paths:
      - "backend/**"
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone project
        uses: actions/checkout@v3

      - name: Install Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17

      - name: Build backend
        run: |
          cd backend
          mvn clean install