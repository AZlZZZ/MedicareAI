<div class="auth-container d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow p-4" style="max-width:420px; width:100%">

    <div *ngIf="success" class="text-center py-4">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" class="mb-3">
        <circle cx="12" cy="12" r="11" stroke="#28a745" stroke-width="1.5"/>
        <path d="M7 12l3.5 3.5L17 8" stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h5 class="text-success">Password reset successfully!</h5>
      <p class="text-muted small">Redirecting to login...</p>
    </div>

    <ng-container *ngIf="!success">
      <h4 class="mb-1 fw-600">Reset Password</h4>
      <p class="text-muted small mb-4">Enter your new password below.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label">New Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control" formControlName="password"
            placeholder="Min 8 chars, upper, lower, number, special"
            [class.is-invalid]="password?.invalid && password?.touched" />
          <div class="invalid-feedback">
            <span *ngIf="password?.errors?.['required']">Required.</span>
            <span *ngIf="password?.errors?.['minlength']">Min 8 characters.</span>
            <span *ngIf="password?.errors?.['pattern']">Must include uppercase, lowercase, number and special character.</span>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control" formControlName="confirm"
            placeholder="Repeat password"
            [class.is-invalid]="(confirm?.touched && form.errors?.['mismatch'])" />
          <div class="invalid-feedback">Passwords do not match.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          Reset Password
        </button>

        <div class="text-center mt-3">
          <a routerLink="/auth/login" class="text-muted small">Back to login</a>
        </div>

      </form>
    </ng-container>

  </div>
</div>
